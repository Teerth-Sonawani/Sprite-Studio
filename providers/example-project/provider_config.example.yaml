# Example provider configuration for the Mosslight sample project.
# Copy this file outside version control if you need project-specific overrides.
# NEVER add an API key here. Set PERCHANCEAI_API_KEY in the environment.

provider: perchance
mode: developer_api

project:
  id: mosslight
  root: projects/example-project
  brief: projects/example-project/assets/briefs/moss_slime.yaml
  style: projects/example-project/style_guide.yaml
  animation: projects/example-project/animations/moss_slime_walk.yaml
  prompt_output: projects/example-project/assets/source/prompts/moss_slime_walk.prompt.txt
  source_output: projects/example-project/assets/source/perchance

discovery:
  # Discover the real key with:
  #   python tools/generate_asset.py models --provider perchance --modality image
  model_key: null
  operation: image_generation

cost:
  currency: credits
  max_credits_per_request: 30
  require_estimate: true
  require_confirm: true

polling:
  interval_seconds: 2
  max_polls: 150

safety:
  store_idempotency_keys: true
  never_log_credentials: true
  never_send_bearer_to_signed_output_urls: true
  on_uncertain_submission: stop_and_check_status

notes: >
  The sample project's checked-in art is procedural demo art. A provider run
  creates new candidates under assets/source/perchance; it does not replace the
  demo manifests or their provenance.
