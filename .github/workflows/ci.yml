name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"

      - name: Byte-compile package and tools
        run: python -m compileall -q sprite_studio tools

      - name: Lint
        run: python -m ruff check sprite_studio tools scripts tests

      - name: Type check
        run: python -m mypy sprite_studio

      - name: Run tests with coverage gate
        run: python -m pytest -q --cov=sprite_studio --cov-report=term-missing

  demo-build:
    name: Demo build and manifest hash verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"

      - name: Rebuild the example project (first pass)
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: python scripts/build_demo_assets.py --stage all

      - name: Snapshot every generated file
        run: |
          find projects/example-project -type f \
            -not -path '*/__pycache__/*' -print0 \
            | sort -z | xargs -0 sha256sum > "${RUNNER_TEMP}/build-1.sha256"

      - name: Rebuild the example project (second pass)
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: python scripts/build_demo_assets.py --stage all

      - name: Assert the rebuild is byte-for-byte reproducible
        run: |
          find projects/example-project -type f \
            -not -path '*/__pycache__/*' -print0 \
            | sort -z | xargs -0 sha256sum > "${RUNNER_TEMP}/build-2.sha256"
          diff -u "${RUNNER_TEMP}/build-1.sha256" "${RUNNER_TEMP}/build-2.sha256"

      - name: Show the working tree on failure
        if: failure()
        run: git status --short
