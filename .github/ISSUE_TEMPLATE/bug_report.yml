name: Bug report
description: Report a reproducible defect in the pipeline, tooling, docs or example project.
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please redact API keys, tokens and personal data.
        For security issues, use the private process in SECURITY.md instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong, in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include exact commands and paths.
      placeholder: |
        1. Run `python tools/validate_sprite.py ...`
        2. Open `qa/report.json`
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Paste the traceback or output. Redact secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "1.0.0 or commit SHA"
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "Python 3.12.4 on Windows 11"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Image inspection or processing
        - Background removal or alpha cleanup
        - Animation or previews
        - Sprite sheets or atlas packing
        - Tiling
        - QA or review lifecycle
        - Manifest or schema
        - Provider or generation
        - Export (generic, Godot, Unity, Aseprite)
        - CLI or packaging
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach contact sheets, previews, report JSON or manifest excerpts where useful.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed credentials and personal data from this report.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
