style_id: mosslight_pixel_16
display_name: Mosslight 16-bit Pixel Style
description: >-
  A cozy, readable 16-bit-inspired woodland style with a restrained green/amber
  palette, hard pixel edges, selective 1 px outlines and two-band cel shading.
style_family: pixel_16
project: mosslight

line_art:
  outline_width: 1px at 32px display; 2px at 64px authoring scale
  outline_colour: "#1b2a2a"
  interior_lines: selective, only where the form needs separation

palette:
  maximum_colours: 24
  colour_temperature: cool greens with warm amber accents
  swatches:
    - "#10181c"
    - "#1b2a2a"
    - "#355c4a"
    - "#5f8f5a"
    - "#a8c66c"
    - "#f2e8c9"
    - "#e7a05a"
    - "#7a4f3a"
  exceptions:
    - colour: "#ffffff"
      scope: 1-2 px emissive core of sparkle assets only
      reason: Keeps small effects legible against the warm paper highlight

shading:
  highlight_style: one hard highlight cluster
  shadow_style: one or two hard shadow clusters, hue-shifted toward blue-green
  texture: sparse 1 px clusters only where they read at 1x

lighting:
  direction: upper-left key, cool ambient fill
  contrast: medium-high; silhouettes must separate from the background

perspective: side-on orthographic; no vanishing point
proportions: characters 32-48px tall; slimes wider than tall; props grounded
detail_density: low-medium; cluster detail, never single-pixel noise
pixel_grid: true
anti_aliasing: false
edge_quality: crisp, intentional pixel clusters

recommended_canvas_sizes: [32x32, 48x48, 64x64, 96x96, 128x128]
recommended_export_settings:
  format: png
  mode: RGBA
  resample: nearest
  integer_scale: true

generation_prompt_modifiers:
  - "true 16-bit pixel art with hard edges and a limited mossy palette"
  - "cozy woodland fantasy, warm firefly accents"
  - "readable silhouette at 32 pixels tall"
negative_prompt_modifiers:
  - "anti-aliasing"
  - "photorealistic texture"
  - "neon colours"
  - "existing copyrighted character"
  - "pure black outline"
processing_rules:
  - "nearest-neighbour resize only"
  - "do not blur or apply Lanczos to pixel art"
  - "remove backgrounds edge-aware; preserve intentional highlights"
  - "keep at least 2 px transparent padding around characters and UI icons"

approved_references:
  - projects/example-project/assets/approved/moss_slime/frames/idle/moss_slime__idle__frame_000.png
  - projects/example-project/assets/approved/grass_tile/grass_tile.png

notes: >
  This guide is the frozen single source of truth for Mosslight asset
  production. Any deviation must be recorded in the project changelog and
  approved by the same reviewer who accepts the asset.
